<title>INTERN Cluster Amsterdam | One Day Clinic | Pingwin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --surface-2:#FBF8F5;
  --ink:#2F2A2A; --muted:#6E6663; --line:#F0E7DF; --line-strong:#DCD2CA;
  --accent:#F15829; --accent-warm:#E7773F; --accent-soft:#FDEEE7;
  --blue:#0E7E9A; --blue-soft:#E4F1F5;
  --ok:#1E6B3C; --ok-bg:#E6F1E9;
  --warn:#8A5711; --warn-bg:#F8EFE0;
  --stop:#A22F3B; --stop-bg:#F8E8EA;
  --idle:#84796B; --idle-bg:#F2EEE9;
  --grad:linear-gradient(228deg,#C7E2EB 38%,#F8DABC 80%);
  --shadow:0 1px 2px rgba(47,42,42,.05),0 10px 30px -18px rgba(47,42,42,.28);
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{max-width:1020px;margin:0 auto;padding:40px 22px 110px;display:flex;flex-direction:column;gap:34px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 12px}
h1{font-weight:800;font-size:clamp(31px,5vw,44px);line-height:1.08;margin:0 0 14px;letter-spacing:.2px;text-wrap:balance}
h2{font-weight:700;font-size:26px;line-height:1.22;margin:0 0 10px;letter-spacing:.2px;text-wrap:balance}
h3{font-weight:700;font-size:14px;margin:0 0 7px;letter-spacing:.2px}
p{margin:0 0 12px;max-width:68ch}p:last-child{margin-bottom:0}
.lede{font-size:17.5px;color:var(--muted);max-width:66ch;font-weight:500}
a{color:var(--accent)}
a.u{word-break:break-all}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em}
header.top{background:var(--grad);border-radius:30px;padding:38px 34px 32px;border:1px solid rgba(255,255,255,.6)}
header.top .lede{color:#3C4A4E}
header .meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:20px;font-size:12px;color:#4C5A5E;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.stat{background:var(--surface);padding:18px 20px}
.stat .k{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:7px;font-weight:600;line-height:1.4}
.stat .v{font-size:31px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;display:block}
.stat .s{font-size:12.5px;color:var(--muted);display:block;margin-top:6px}
.stat.hot .v{color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 26px;box-shadow:var(--shadow)}
.panel.flat{box-shadow:none;background:var(--surface-2)}
.badge{display:inline-flex;align-items:center;flex:none;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;padding:5px 12px;border-radius:30px;font-weight:700;white-space:nowrap}
.b-win{background:var(--ok-bg);color:var(--ok)}
.b-fix{background:var(--warn-bg);color:var(--warn)}
.b-301{background:var(--stop-bg);color:var(--stop)}
.b-none{background:var(--idle-bg);color:var(--idle)}
.b-ask{background:var(--accent-soft);color:var(--accent)}

/* context toggle */
details.ctx{border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
details.ctx>summary{cursor:pointer;list-style:none;padding:0}
details.ctx>summary::-webkit-details-marker{display:none}
.ctxhead{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 26px}
.ctxhead b{font-size:17px;font-weight:700}
.ctxhead span{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
details.ctx[open] .ctxhead{border-bottom:1px solid var(--line)}
details.ctx[open] .ctxhead .open-l{display:none}
details.ctx:not([open]) .ctxhead .close-l{display:none}
.cards{display:flex;flex-direction:column;gap:26px;padding:26px}
.card{border-bottom:1px solid var(--line);padding-bottom:24px}
.card:last-child{border-bottom:0;padding-bottom:0}
.card h3{color:var(--accent);font-size:17px;margin-bottom:10px}
.card p{font-size:14.5px;color:var(--muted);max-width:78ch}
.card p strong{color:var(--ink)}

/* rows */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filters .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px;font-weight:600}
.chip{font:inherit;font-weight:600;font-size:13px;cursor:pointer;padding:6px 15px;border-radius:30px;border:1px solid var(--line-strong);background:transparent;color:var(--muted)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:focus-visible,summary:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rows{display:flex;flex-direction:column;gap:9px}
details.row{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
details.row[open]{border-color:var(--line-strong);box-shadow:var(--shadow)}
details.row>summary{cursor:pointer;list-style:none;padding:0}
details.row>summary::-webkit-details-marker{display:none}
.rowhead{display:grid;grid-template-columns:30px 20px 1fr auto;gap:12px;align-items:center;padding:15px 20px}
.rownum{font-weight:800;font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums;text-align:right}
.caret{color:var(--muted);transition:transform .15s ease;font-size:11px;line-height:1;justify-self:center}
details.row[open] .caret{transform:rotate(90deg)}
.rowmain{min-width:0}
.rowurl{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;display:block;font-weight:500}
.rowsub{font-size:12.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.rowhead{grid-template-columns:26px 1fr;gap:10px}.caret{display:none}.rowright{grid-column:2;margin-top:4px}}
.body{padding:2px 22px 22px 62px;border-top:1px solid var(--line)}
@media (max-width:640px){.body{padding-left:20px}}
.block{padding-top:17px}
.block h3{color:var(--accent)}
.block.q h3{color:var(--warn)}
.block.dev{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-top:17px}
.block.dev h3{color:var(--ink)}
ul.tight,ol.tight{margin:0;padding-left:19px}
ul.tight li,ol.tight li{margin-bottom:7px;max-width:66ch}
ul.tight li:last-child,ol.tight li:last-child{margin-bottom:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 18px;font-size:13.5px;font-variant-numeric:tabular-nums;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 14px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
td.num{text-align:right;padding-right:20px;white-space:nowrap}
td.st{font-weight:800;color:var(--accent)}
.note{border-left:3px solid var(--accent);padding:3px 0 3px 15px;color:var(--muted);font-size:14.5px}
.src{font-size:11.5px;color:var(--muted);margin-top:14px}
.btn{font:inherit;font-weight:600;font-size:13px;cursor:pointer;padding:8px 16px;border-radius:30px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-warm);border-color:var(--accent-warm);color:#fff}
.prompt{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;white-space:pre-wrap;margin-top:9px}
.q-item{border-top:1px solid var(--line);padding:18px 0}
.q-item:first-of-type{border-top:0;padding-top:4px}
.q-item .qq{font-weight:700;margin-bottom:5px}
.q-item .qc{color:var(--muted);font-size:14px;margin-bottom:11px;max-width:66ch}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:9px}
.opt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:30px;padding:6px 15px;font-size:13.5px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.opt input{margin:0;accent-color:var(--accent)}
textarea{width:100%;font:inherit;font-size:14px;padding:10px 12px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);resize:vertical;min-height:46px}
.saverow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px}
.savemsg{font-size:13px;color:var(--muted)}
hr.sep{border:0;border-top:1px solid var(--line);margin:0}
footer{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
details.grp{border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;border-left:5px solid var(--gc)}
details.grp>summary{cursor:pointer;list-style:none;padding:0}
details.grp>summary::-webkit-details-marker{display:none}
.grphead{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;padding:18px 24px}
.grphead b{font-size:17px;font-weight:700}
.grphead .cnt{font-size:13px;font-weight:700;color:var(--gc);white-space:nowrap}
.grphead .tog{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
details.grp[open] .grphead{border-bottom:1px solid var(--line)}
details.grp[open] .tog-open{display:none}
details.grp:not([open]) .tog-dicht{display:none}
.grpbody{padding:20px 24px 24px}
.grpintro{font-size:14.5px;color:var(--muted);margin-bottom:18px;max-width:78ch}
.pg{border-top:1px solid var(--line);padding:16px 0}
.pg:first-of-type{border-top:0;padding-top:0}
.pgtop{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin-bottom:6px}
.pgurl{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;font-weight:600;word-break:break-all}
.pgact{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 11px;border-radius:30px;background:var(--gcs);color:var(--gc);white-space:nowrap}
.pgcijf{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:9px}
.pgdoen{margin:0;padding-left:19px;font-size:14px}
.pgdoen li{margin-bottom:5px;max-width:74ch}
.pglet{font-size:13.5px;color:var(--muted);margin-top:9px;border-left:3px solid var(--line-strong);padding-left:12px;max-width:74ch}
.win{--gc:var(--ok);--gcs:var(--ok-bg)}
.fix{--gc:var(--warn);--gcs:var(--warn-bg)}
.g301{--gc:var(--stop);--gcs:var(--stop-bg)}
.ask{--gc:var(--accent);--gcs:var(--accent-soft)}
.none{--gc:var(--idle);--gcs:var(--idle-bg)}
.alarm{background:var(--stop-bg);border:1px solid var(--stop);border-left:5px solid var(--stop);border-radius:20px;padding:22px 26px}
.alarm h2{color:var(--stop);margin-bottom:8px}
.alarm p,.alarm li{color:#5C2027}
.devstap{counter-reset:ds;display:flex;flex-direction:column;gap:18px;margin-top:6px}
.dev1{border:1px solid var(--line);border-radius:16px;padding:18px 20px;background:var(--surface-2)}
.dev1 h3{font-size:15px;color:var(--accent);margin-bottom:8px}
.dev1 ol,.dev1 ul{margin:0;padding-left:19px;font-size:14px}
.dev1 li{margin-bottom:6px;max-width:76ch}
.codeblok{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#FFF;border:1px solid var(--line);border-radius:12px;padding:12px 14px;white-space:pre-wrap;margin-top:10px;line-height:1.5;overflow-x:auto}
</style>

<style>
.grpbody .rows{display:flex;flex-direction:column;gap:8px}
.grpbody details.row{border-radius:14px;background:var(--surface-2);border-color:var(--line)}
.grpbody details.row[open]{background:var(--surface)}
.grpbody .rowhead{grid-template-columns:26px 18px 1fr auto;padding:13px 16px}
.grpbody .rownum{color:var(--gc);font-size:15px}
.grpbody .body{padding:2px 18px 20px 58px}
@media (max-width:640px){.grpbody .rowhead{grid-template-columns:24px 1fr}.grpbody .body{padding-left:16px}}
.block h3{color:var(--accent);font-size:13.5px;letter-spacing:.04em;text-transform:uppercase}
.block.dev h3{color:var(--ink)}
.block p{font-size:14.5px;color:var(--muted);max-width:72ch}
.kv dt{font-weight:500}
.pglet{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0;color:var(--ink);font-size:14px;margin:0}
</style>

<style>
/* uitgelijnde kerncijfers */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.stat{background:var(--surface);padding:20px 22px;display:grid;grid-template-rows:auto auto auto;row-gap:8px;align-content:start}
.stat .k{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700;line-height:1.5;margin:0;min-height:2.2em;display:flex;align-items:flex-start}

}

details.pan>summary{cursor:pointer;list-style:none;padding:0}

.panhead{display:grid;grid-template-columns:20px 1fr auto;gap:14px;align-items:center;padding:20px 26px}
.panhead b{font-size:19px;font-weight:700;letter-spacing:.2px}
.panhead .tog{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
details.pan[open] .panhead{border-bottom:1px solid var(--line)}
details.pan[open] .tog-open{display:none}
details.pan:not([open]) .tog-dicht{display:none}
.panbody{padding:22px 26px 26px}
.panbody h2{display:none}
.pijl{color:var(--accent);font-size:12px;line-height:1;transition:transform .15s ease;justify-self:center}
details[open]>summary .pijl{transform:rotate(90deg)}
/* pijl links bij de contexttoggle en de groepen */
.ctxhead{display:grid;grid-template-columns:20px 1fr auto;gap:14px;align-items:center}
.grphead{grid-template-columns:20px 1fr auto auto;gap:14px}
</style>
</head>

function wire(){
 app.querySelectorAll('input[type=radio]').forEach(function(r){r.addEventListener('change',function(){STATE.answers[r.name]=r.value;});});
 app.querySelectorAll('[data-note]').forEach(function(t){t.addEventListener('input',function(){STATE.notes[t.dataset.note]=t.value;});});
 var c=document.getElementById('copyans');
 if(c){c.addEventListener('click',function(){navigator.clipboard.writeText(answersText()).then(function(){var o=c.textContent;c.textContent='Gekopieerd';setTimeout(function(){c.textContent=o;},1600);});});}
 app.querySelectorAll('[data-copy]').forEach(function(b){b.addEventListener('click',function(){
   var t=document.getElementById(b.dataset.copy).textContent;
   navigator.clipboard.writeText(t).then(function(){var o=b.textContent;b.textContent='Gekopieerd';setTimeout(function(){b.textContent=o;},1600);});});});
 var sv=document.getElementById('save'); if(sv){sv.addEventListener('click',doSave);}
}
function answersText(){
 var l=['Antwoorden cluster Amsterdam, One Day Clinic, versie '+D.versie,''];
 D.vragen.forEach(function(q){l.push(q.vraag);l.push('  Antwoord: '+(STATE.answers[q.id]||'nog niet ingevuld'));if(STATE.notes[q.id]){l.push('  Toelichting: '+STATE.notes[q.id]);}l.push('');});
 return l.join('\n');
}
function doSave(){
 var msg=document.getElementById('savemsg'),btn=document.getElementById('save');
 STATE.savedAt=new Date().toLocaleString('nl-NL'); btn.disabled=true; msg.textContent='Opslaan...';
 claude.use('artifact').then(function(a){
  if(!a){msg.textContent='Opslaan lukt hier niet. Gebruik Kopieer antwoorden.';btn.disabled=false;return;}
  document.getElementById('answers-state').textContent=JSON.stringify(STATE);
  app.innerHTML=''; var doc='<!doctype html>\n'+document.documentElement.outerHTML; render();
  return a.publish(doc).then(function(){var m=document.getElementById('savemsg'); if(m){m.textContent='Opgeslagen op '+STATE.savedAt;}});
 }).catch(function(){render();var m=document.getElementById('savemsg'); if(m){m.textContent='Opslaan is niet gelukt. Gebruik Kopieer antwoorden.';}});
}
render();
})();
