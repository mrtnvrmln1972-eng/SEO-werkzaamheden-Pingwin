# ═══════════════════════════════════════════════════════════
# EEN TWEAK-RONDE, GESTART VANUIT HET DASHBOARD
# ═══════════════════════════════════════════════════════════
# Maarten drukt op "Nu draaien" op /admin/tweaks, of het uurwerk van het
# dashboard doet het vanzelf (/api/cron/nachtronde: overdag start jij hem zelf, als er iets
# klaarstaat). Wat hier gebeurt is precies wat er in een chat gebeurt als hij
# /tweaks plakt: de wachtrij wordt geclaimd, afgewerkt, gebouwd en in één keer
# live gezet.
#
# GEEN EIGEN UURSCHEMA, EN GEEN GEDEELDE SLEUTEL MEER
# ───────────────────────────────────────────────────────────
# Tot 15-08-2026 kwam de ronde bij het dashboard binnen met de meekijk-sleutel
# van Maarten (PINGWIN_KIJK_SLEUTEL als repo-secret). Die sleutel is van een
# mens: hij vervalt zodra Maarten in de cockpit een nieuwe aanmaakt. Dat gebeurde
# die dag, en vanaf dat moment kwam elke ronde er niet meer in. Ze meldden
# "geslaagd", claimden niets, en de meldingen stonden een uur later nog gewoon in
# de wachtrij. Het logboek zei het in één regel: {"ok":false,"error":"Geen toegang."}
#
# Nu geeft het dashboard elke ronde een eigen ondertekende toegangsbon mee op het
# moment dat het hem start. Niets te kopiëren, en een nieuwe meekijk-sleutel
# raakt de rondes niet meer.
#
# Twee sleutels, en meer niet:
#  - CLAUDE_CODE_OAUTH_TOKEN, repo-secret in GitHub. Waarmee de ronde mag denken,
#    op Maartens eigen abonnement in plaats van op een aparte rekening.
#    Staat hij er niet, dan wordt ANTHROPIC_API_KEY gebruikt (betalen per woord).
#  - GITHUB_TWEAK_TOKEN, in Vercel. Waarmee het dashboard dit hier mag starten.
#    Die hoort bij de starter, niet bij de ronde, en komt hier dus niet voor.
# ═══════════════════════════════════════════════════════════

name: Tweak-ronde

on:
  workflow_dispatch:
    inputs:
      bon:
        description: "Toegangsbon van het dashboard (wordt automatisch meegegeven)"
        required: true
      ronde:
        description: "Naam van deze ronde"
        required: true

# Eén ronde tegelijk, ook als er twee keer op de knop gedrukt wordt. Het slot in
# de database bewaakt dit al; dit is de tweede sluiting, hier bij de bron.
#
# De groep heet sinds 15-08-2026 `bouwronde` en niet meer `tweak-ronde`, want de
# bouwronde voor grote punten (punt-nacht.yml) zit in dezelfde groep. Grote
# punten en tweaks bouwen nooit tegelijk: overdag de tweaks, 's nachts de grote
# punten, en als ze elkaar toch tegenkomen wacht de tweede.
concurrency:
  group: bouwronde
  cancel-in-progress: false

jobs:
  ronde:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      # Schrijven, want een ronde eindigt met een commit naar main.
      contents: write
      # De actie haalt zijn eigen GitHub-toegang op via een OIDC-token. Zonder
      # dit recht mislukt hij na drie pogingen met "Could not fetch an OIDC
      # token", nog vóór er ook maar iets gebouwd wordt. Aangetroffen bij de
      # allereerste proefronde op 15-08-2026; weghalen is dus hetzelfde als de
      # werkstroom uitzetten.
      id-token: write
    env:
      DASHBOARD: https://pingwin-seo-dashboard.vercel.app
      TWEAK_RONDE: ${{ github.event.inputs.ronde }}
      RONDE_JAR: /tmp/ronde-cookies.txt

    steps:
      # ═══════════════════════════════════════════════════════
      # WIE BETAALT DEZE RONDE
      # ═══════════════════════════════════════════════════════
      # Staat hier bovenaan en draait altijd, ook als er verder niets te doen is,
      # zodat in élk logboek zwart op wit staat welke rekening het denkwerk van
      # deze ronde betaalt. Reden: op 15-08-2026 bleek één plan 7,24 dollar te
      # hebben gekost, en dat was nergens te zien; je moest het uit het logboek
      # peuteren. Er wordt hier nooit een sleutel afgedrukt, alleen welke van de
      # twee gebruikt wordt.
      - name: Wie betaalt deze ronde
        run: |
          echo "Rekening: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'jouw Claude-abonnement (geen losse rekening)' || 'de betaalde API-sleutel, per verwerkt woord' }}"

      # ═══════════════════════════════════════════════════════
      # TOEGANG EERST, EN HARD STOPPEN ALS HET NIET LUKT
      # ═══════════════════════════════════════════════════════
      # Dit is de stap die er op 15 augustus niet was. De ronde kwam er niet in,
      # ging vrolijk verder, deed niets, en de werkstroom kleurde groen. Een
      # ronde die niet bij zijn eigen wachtrij kan, hoort te mislukken, niet te
      # slagen; anders blijft de stapel staan en ziet niemand waarom.
      - name: Toegang tot het dashboard
        id: toegang
        run: |
          ANTWOORD="$(curl -s --max-time 20 -c "$RONDE_JAR" \
            "$DASHBOARD/api/ronde/toegang?bon=${{ github.event.inputs.bon }}")"
          echo "$ANTWOORD"
          case "$ANTWOORD" in
            *'"ok":true'*) echo "Toegang in orde." ;;
            *) echo "::error::De ronde kan niet bij het dashboard. Hij bouwt dus niets; dit is expres een mislukking en geen stille afloop."; exit 1 ;;
          esac

      - name: De laatste code ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node klaarzetten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # De pakketten uit de cache halen scheelt elke ronde een stuk van de
          # opstarttijd. Die opstarttijd is vaste kost: even lang voor één
          # aanpassing als voor tien, dus elke seconde eraf telt dubbel.
          cache: npm

      - name: Pakketten installeren
        run: npm ci

      - name: De stapel afwerken
        uses: anthropics/claude-code-action@v1
        env:
          DASHBOARD: https://pingwin-seo-dashboard.vercel.app
          # De naam van deze ronde en de plek waar zijn toegang staat, zodat de
          # opdracht in .claude/commands/tweaks.md precies déze ronde claimt en
          # teruggeeft, en nooit die van iemand anders.
          TWEAK_RONDE: ${{ github.event.inputs.ronde }}
          RONDE_JAR: /tmp/ronde-cookies.txt
        with:
          # ── WELKE REKENING DIT WERK BETAALT ──
          # Staat CLAUDE_CODE_OAUTH_TOKEN als repo-secret klaar, dan draait deze
          # ronde op Maartens Claude-abonnement, precies zoals een gewone chat:
          # geen aparte rekening per ronde. Staat hij er niet, dan valt hij terug
          # op ANTHROPIC_API_KEY, en dat is betalen per verwerkt woord. Dat laatste
          # was tot 15-08-2026 de enige weg, en daardoor kostte één mislukt plan
          # 7,24 dollar terwijl dezelfde vraag in een chat niets extra's kost.
          #
          # Allebei invullen kan niet: een lege waarde telt als niet ingevuld, dus
          # de sleutel wordt alleen doorgegeven als er géén token is.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          # Dezelfde opdracht als in een chat: .claude/commands/tweaks.md.
          prompt: "/tweaks"
          # HET MODEL HOORT BIJ HET SOORT WERK, EN DAT IS HIER VASTGEZET.
          # Pingwins eigen regel (brein/12-zuinig-werken.md): het middelste model
          # voor bouwen, opmaken, teksten en mechanisch werk, het zwaarste alleen
          # voor strategie en beoordelen. Een tweak-ronde is per definitie het
          # eerste: kleine, scherp omschreven correcties op één scherm.
          #
          # Wordt een ronde structureel te dom voor zijn werk, dan is dat een
          # signaal dat er te grote dingen in de wachtrij komen; die horen op
          # "apart" en daarna naar de grote punten, niet op een zwaarder model.
          claude_args: "--model claude-sonnet-5 --allowedTools Bash,Edit,Write,Read,Glob,Grep"

      # ═══════════════════════════════════════════════════════
      # HET SLOT GAAT ALTIJD TERUG, OOK ALS DE RONDE MISLUKT
      # ═══════════════════════════════════════════════════════
      # Zonder deze stap eindigt de werkstroom terwijl het slot van hem blijft.
      # Live gebeurd op 15-08-2026, eerste echte ronde: de werkstroom was na
      # 79 seconden klaar, en het scherm bleef "er loopt een ronde" zeggen tot
      # het slot drie kwartier later vanzelf verviel.
      #
      # `if: always()` is hier het hele punt: juist een ronde die halverwege
      # omvalt moet de wachtrij vrijgeven.
      - name: De wachtrij hoe dan ook teruggeven
        if: always() && steps.toegang.outcome == 'success'
        run: |
          curl -s --max-time 15 -b "$RONDE_JAR" -X POST \
            -H "Content-Type: application/json" \
            -d "{\"actie\":\"terug\",\"ronde\":\"$TWEAK_RONDE\"}" \
            "$DASHBOARD/api/admin/tweaks/ronde" || true
          echo ""
