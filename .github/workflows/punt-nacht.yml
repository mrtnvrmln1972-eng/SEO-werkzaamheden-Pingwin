# ═══════════════════════════════════════════════════════════
# DE BOUWRONDE VOOR ÉÉN GROOT PUNT
# ═══════════════════════════════════════════════════════════
# Wordt gestart door het dashboard: elk uur vanzelf binnen het nachtvenster
# (/api/cron/nachtronde), of meteen met de knop "Nu draaien" op
# /admin/grote-punten. Hij pakt ÉÉN punt: het bovenste uit de bouwwachtrij, dus
# een punt met een plan waar Maarten ja tegen gezegd heeft. Staat er niets te
# bouwen, dan schrijft hij een plan voor een punt waar hij er een van gevraagd
# heeft. Staat er helemaal niets, dan start het dashboard hem niet eens.
#
# GEEN EIGEN UURSCHEMA HIER, EN DAT IS EEN REPARATIE
# ───────────────────────────────────────────────────────────
# Een schema in GitHub betekent dat de werkstroom zelf moet gaan kijken of er
# werk is, en daar had hij een sleutel van Maarten voor nodig. Die verviel op
# 15-08-2026 doordat hij in de cockpit een nieuwe meekijk-sleutel maakte, en
# vanaf dat moment kwam elke ronde er niet meer in: ze meldden "geslaagd" en
# deden niets. Nu weet het dashboard of er werk is (het is zijn eigen wachtrij),
# start het de werkstroom alleen dán, en geeft het meteen een ondertekende
# toegangsbon mee. Er valt dus geen enkel geheim meer te kopiëren.
#
# Twee sleutels, en meer niet:
#  - CLAUDE_CODE_OAUTH_TOKEN, repo-secret in GitHub. Waarmee de ronde mag denken,
#    op Maartens eigen abonnement in plaats van op een aparte rekening. Er is geen
#    terugval op een API-sleutel: ontbreekt dit token, dan mislukt de ronde, en dat
#    is beter dan stilletjes per woord gaan afrekenen.
#  - GITHUB_TWEAK_TOKEN, in Vercel. Waarmee het dashboard dit hier mag starten.
#    Die hoort bij de starter, niet bij de ronde, en komt hier dus niet voor.
# ═══════════════════════════════════════════════════════════

name: Groot punt, bouwronde

on:
  workflow_dispatch:
    inputs:
      bon:
        description: "Toegangsbon van het dashboard (wordt automatisch meegegeven)"
        required: true
      ronde:
        description: "Naam van deze ronde"
        required: true
      handmatig:
        description: "Buiten het nachtvenster starten (alleen vanaf de knop in het dashboard)"
        required: false
        default: "nee"
      model:
        description: "Welk model dit werk doet; het dashboard kiest dit (zie lib/punt-model.ts)"
        required: false
        default: "claude-sonnet-5"

# Eén ronde tegelijk, over BEIDE banen heen: de tweak-ronde zit in dezelfde
# groep. Het slot in de database bewaakt dit al; dit is de tweede sluiting, hier
# bij de bron. Grote punten en tweaks bouwen nooit tegelijk.
concurrency:
  group: bouwronde
  cancel-in-progress: false

jobs:
  ronde:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # Schrijven, want een ronde eindigt met een commit naar main.
      contents: write
      # De actie haalt zijn eigen GitHub-toegang op via een OIDC-token. Zonder
      # dit recht mislukt hij nog vóór er iets gebouwd wordt.
      id-token: write
    env:
      DASHBOARD: https://pingwin-seo-dashboard.vercel.app
      PUNT_RONDE: ${{ github.event.inputs.ronde }}
      RONDE_JAR: /tmp/ronde-cookies.txt
      PUNT_HANDMATIG: ${{ github.event.inputs.handmatig || 'nee' }}

    steps:
      # ═══════════════════════════════════════════════════════
      # WIE BETAALT DEZE RONDE
      # ═══════════════════════════════════════════════════════
      # Staat hier bovenaan en draait altijd, ook als er verder niets te doen is,
      # zodat in élk logboek zwart op wit staat welke rekening het denkwerk van
      # deze ronde betaalt. Reden: op 15-08-2026 bleek één plan 7,24 dollar te
      # hebben gekost, en dat was nergens te zien; je moest het uit het logboek
      # peuteren. Er wordt hier nooit een sleutel afgedrukt, alleen welke van de
      # twee gebruikt wordt.
      - name: Wie betaalt deze ronde
        run: |
          echo "Rekening: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'jouw Claude-abonnement (geen losse rekening)' || 'de betaalde API-sleutel, per verwerkt woord' }}"

      # ═══════════════════════════════════════════════════════
      # TOEGANG EERST, EN HARD STOPPEN ALS HET NIET LUKT
      # ═══════════════════════════════════════════════════════
      # Dit is de stap die er op 15 augustus niet was. Toen kwam de ronde er niet
      # in, ging vrolijk verder, deed niets, en de werkstroom kleurde groen. Een
      # ronde die niet bij zijn eigen wachtrij kan, hoort te mislukken, niet te
      # slagen; anders staat de nacht stil en ziet niemand het.
      - name: Toegang tot het dashboard
        id: toegang
        run: |
          ANTWOORD="$(curl -s --max-time 20 -c "$RONDE_JAR" \
            "$DASHBOARD/api/ronde/toegang?bon=${{ github.event.inputs.bon }}")"
          echo "$ANTWOORD"
          case "$ANTWOORD" in
            *'"ok":true'*) echo "Toegang in orde." ;;
            *) echo "::error::De ronde kan niet bij het dashboard. Hij bouwt dus niets; dit is expres een mislukking en geen stille afloop."; exit 1 ;;
          esac

      # ═══════════════════════════════════════════════════════
      # WAT ER KLAARSTAAT, GELEZEN OP DE JUISTE PLEK
      # ═══════════════════════════════════════════════════════
      # Hier stond `grep -o '"werk":"[a-z]*"' | head -1`, en dat is naar één
      # woord vissen in plaats van het op zijn eigen plek lezen. Het antwoord
      # bevat "werk" namelijk twee keer:
      #
      #   stand.werk     wat er NU loopt          "bouw" of "plan"
      #   volgende.werk  wat er KLAARSTAAT        "bouwen" of "plan"
      #
      # `stand` staat vooraan, dus de eerste treffer was altijd stand.werk, en
      # die is "bouw" zolang er niets loopt. Dat is niet "bouwen" en niet
      # "plan", dus beide stappen hieronder werden élke keer overgeslagen. De
      # ronde startte, kleurde groen en deed niets; op het scherm bleef het punt
      # op "nog niet begonnen" staan en leek de knop "Begin nu met het plan"
      # kapot. Dit gold ook voor het bouwen, dus de hele nacht liep leeg.
      # Live aangetroffen op 15-08-2026.
      #
      # Nu wordt het pad expliciet gelezen (jq staat op elke runner), en een
      # antwoord dat we niet kennen laat de ronde hard mislukken. Dezelfde regel
      # als bij de toegangsstap hierboven: liever zichtbaar stuk dan stil niets.
      - name: Wat staat er klaar?
        id: kijk
        run: |
          ANTWOORD="$(curl -s --max-time 20 -b "$RONDE_JAR" "$DASHBOARD/api/admin/punten/ronde" || echo '{}')"
          WERK="$(printf '%s' "$ANTWOORD" | jq -r '.volgende.werk // "geen"' 2>/dev/null || echo onleesbaar)"
          echo "werk=$WERK" >> "$GITHUB_OUTPUT"
          echo "Wat er klaarstaat: $WERK"
          case "$WERK" in
            bouwen|plan|geen) ;;
            *) echo "::error::Het dashboard gaf iets onverwachts terug over wat er klaarstaat ($WERK). De ronde stopt hier, want doorgaan zou betekenen: draaien en niets doen."; exit 1 ;;
          esac

      - name: De laatste code ophalen
        if: steps.kijk.outputs.werk != 'geen'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node klaarzetten
        if: steps.kijk.outputs.werk != 'geen'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # De pakketten uit de cache halen scheelt elke ronde een stuk van de
          # opstarttijd. Die opstarttijd is vaste kost: even lang voor één
          # aanpassing als voor tien, dus elke seconde eraf telt dubbel.
          cache: npm

      - name: Pakketten installeren
        if: steps.kijk.outputs.werk != 'geen'
        run: npm ci

      # ── Bouwen: het middelste model ──
      # Er ligt een goedgekeurd plan; dit is uitvoeren wat er staat, niet
      # opnieuw bedenken wat er moet gebeuren.
      - name: Het punt bouwen
        if: steps.kijk.outputs.werk == 'bouwen'
        uses: anthropics/claude-code-action@v1
        env:
          DASHBOARD: https://pingwin-seo-dashboard.vercel.app
          PUNT_RONDE: ${{ github.event.inputs.ronde }}
          RONDE_JAR: /tmp/ronde-cookies.txt
        with:
          # ── WELKE REKENING DIT WERK BETAALT ──
          # Alleen het abonnementstoken, en geen API-sleutel ernaast. Dat laatste
          # is een reparatie van 15-08-2026, een uur na de eerste poging.
          #
          # Er stond een terugval: geef de API-sleutel door als er geen token is.
          # Die regel leverde bij een aanwezig token een LEGE anthropic_api_key op,
          # en een lege sleutel is niet hetzelfde als geen sleutel: hij komt wél in
          # de omgeving te staan, en een ingevulde API-sleutel gaat vóór een
          # abonnementstoken. Gevolg: de ronde viel in 86 milliseconden om, nog
          # vóór er één woord gedacht was, met kosten nul en zonder leesbare reden.
          #
          # Nu is er één weg. Ontbreekt het token, dan mislukt de ronde zichtbaar,
          # en dat is met opzet beter dan stilletjes terugvallen op de betaalde
          # sleutel: een rekening hoort nooit een verrassing te zijn.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/groot-punt bouwen"
          claude_args: "--model ${{ github.event.inputs.model || 'claude-sonnet-5' }} --allowedTools Bash,Edit,Write,Read,Glob,Grep"

      # ── Een plan schrijven ──
      # Hier wordt niets gebouwd; dit is uitdenken wat er moet gebeuren en waar
      # het misgaat. WELK MODEL DAT DOET STAAT HIER NIET MEER VAST. Dat stond
      # eerst hard op het zwaarste model, dus ook een vraag als "kan dit venster
      # niet gewoon weg?" kreeg de duurste en traagste behandeling. Het
      # dashboard kiest nu op basis van de omvang die Maarten bij het punt heeft
      # gezet: groot gaat zwaar, klein en middel gaan snel. Zie lib/punt-model.ts.
      - name: Een plan schrijven
        if: steps.kijk.outputs.werk == 'plan'
        uses: anthropics/claude-code-action@v1
        env:
          DASHBOARD: https://pingwin-seo-dashboard.vercel.app
          PUNT_RONDE: ${{ github.event.inputs.ronde }}
          RONDE_JAR: /tmp/ronde-cookies.txt
        with:
          # ── WELKE REKENING DIT WERK BETAALT ──
          # Alleen het abonnementstoken, en geen API-sleutel ernaast. Dat laatste
          # is een reparatie van 15-08-2026, een uur na de eerste poging.
          #
          # Er stond een terugval: geef de API-sleutel door als er geen token is.
          # Die regel leverde bij een aanwezig token een LEGE anthropic_api_key op,
          # en een lege sleutel is niet hetzelfde als geen sleutel: hij komt wél in
          # de omgeving te staan, en een ingevulde API-sleutel gaat vóór een
          # abonnementstoken. Gevolg: de ronde viel in 86 milliseconden om, nog
          # vóór er één woord gedacht was, met kosten nul en zonder leesbare reden.
          #
          # Nu is er één weg. Ontbreekt het token, dan mislukt de ronde zichtbaar,
          # en dat is met opzet beter dan stilletjes terugvallen op de betaalde
          # sleutel: een rekening hoort nooit een verrassing te zijn.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/groot-punt plan"
          claude_args: "--model ${{ github.event.inputs.model || 'claude-opus-5' }} --allowedTools Bash,Edit,Write,Read,Glob,Grep"

      # ═══════════════════════════════════════════════════════
      # HET SLOT GAAT ALTIJD TERUG, OOK ALS DE RONDE MISLUKT
      # ═══════════════════════════════════════════════════════
      # `if: always()` is het hele punt: juist een ronde die halverwege omvalt
      # moet de wachtrij vrijgeven. Het punt gaat dan terug in de rij, op zijn
      # eigen plek, en de volgende ronde pakt hem gewoon weer op.
      - name: De wachtrij hoe dan ook teruggeven
        if: always() && steps.toegang.outcome == 'success'
        run: |
          curl -s --max-time 15 -b "$RONDE_JAR" -X POST \
            -H "Content-Type: application/json" \
            -d "{\"actie\":\"terug\",\"ronde\":\"$PUNT_RONDE\"}" \
            "$DASHBOARD/api/admin/punten/ronde" || true
          echo ""
