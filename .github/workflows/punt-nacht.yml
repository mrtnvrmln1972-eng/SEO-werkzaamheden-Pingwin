# ═══════════════════════════════════════════════════════════
# DE NACHTELIJKE BOUWRONDE VOOR ÉÉN GROOT PUNT
# ═══════════════════════════════════════════════════════════
# Elk uur binnen het nachtvenster kijkt deze werkstroom of er iets klaarstaat.
# Zo ja, dan pakt hij ÉÉN punt: het bovenste uit de bouwwachtrij, dus een punt
# met een plan waar Maarten ja tegen gezegd heeft. Staat er niets te bouwen,
# dan schrijft hij in plaats daarvan een plan voor een punt waar hij er een van
# gevraagd heeft. Staat er helemaal niets, dan stopt hij meteen.
#
# WAAROM ELK UUR EN NIET ÉÉN KEER PER NACHT
# ───────────────────────────────────────────────────────────
# Eén punt kan een uur duren, en er passen er meerdere in een nacht. Een enkele
# start om 22:00 zou dus na dat ene punt de rest van de nacht niets doen. Nu
# pakt elk uur de draad weer op: loopt er nog iets, dan stopt de nieuwe ronde
# meteen op het slot (goedkoop); is de vorige klaar, dan gaat de volgende in de
# rij verder. Zo werkt de nacht de wachtrij van boven naar beneden af.
#
# HET SCHEMA STAAT IN UTC, HET VENSTER IN NEDERLANDSE TIJD
# ───────────────────────────────────────────────────────────
# GitHub kent alleen UTC en geen zomertijd. Daarom draait de cron ruim (van
# 20:00 tot 06:00 UTC, dat dekt 22:00 tot 07:00 in Nederland in zowel zomer- als
# wintertijd) en beslist de CODE of het echt nacht is: `baanNu()` in
# lib/punt-tempo.ts, afgedwongen bij het claimen. Eén bron voor het venster, en
# een ronde die te vroeg aanklopt krijgt gewoon nul op het rekest.
#
# Drie sleutels, precies dezelfde als bij de tweak-ronde:
#  - ANTHROPIC_API_KEY, repo-secret in GitHub. Waarmee de ronde mag denken.
#  - PINGWIN_KIJK_SLEUTEL, repo-secret in GitHub. Waarmee de ronde het punt kan
#    claimen, zijn voortgang kan melden en de stand kan bijwerken.
#  - GITHUB_TWEAK_TOKEN, in Vercel. Waarmee de knop "Nu draaien" dit start.
#    Die hoort bij de knop, niet bij de ronde, en komt hier dus niet voor.
# ═══════════════════════════════════════════════════════════

name: Groot punt, nachtronde

on:
  schedule:
    - cron: "0 20,21,22,23,0,1,2,3,4,5 * * *"
  workflow_dispatch:
    inputs:
      handmatig:
        description: "Buiten het nachtvenster starten (alleen vanaf de knop in het dashboard)"
        required: false
        default: "nee"

# Eén ronde tegelijk, over BEIDE banen heen: de tweak-ronde zit in dezelfde
# groep. Het slot in de database bewaakt dit al; dit is de tweede sluiting, hier
# bij de bron. Grote punten en tweaks bouwen nooit tegelijk.
concurrency:
  group: bouwronde
  cancel-in-progress: false

jobs:
  ronde:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # Schrijven, want een ronde eindigt met een commit naar main.
      contents: write
      # De actie haalt zijn eigen GitHub-toegang op via een OIDC-token. Zonder
      # dit recht mislukt hij nog vóór er iets gebouwd wordt.
      id-token: write
    env:
      DASHBOARD: https://pingwin-seo-dashboard.vercel.app
      PUNT_RONDE: gh-${{ github.run_id }}
      PUNT_HANDMATIG: ${{ github.event.inputs.handmatig || 'nee' }}

    steps:
      # ── Eerst kijken, dan pas een dure runner volzetten ──
      # Wat er klaarstaat bepaalt namelijk het MODEL, en dat is Pingwins eigen
      # zuinigheidsregel: het middelste model voor bouwen (mechanisch werk op
      # een uitgeschreven plan), het zwaarste alleen voor het plan zelf, want
      # dat is strategie en beoordelen. Maarten kiest hier niets; de werkstroom
      # weet welk werk hij doet.
      - name: Wat staat er klaar?
        id: kijk
        env:
          PINGWIN_KIJK_SLEUTEL: ${{ secrets.PINGWIN_KIJK_SLEUTEL }}
        run: |
          JAR="$(mktemp)"
          curl -s --max-time 20 -c "$JAR" \
            "$DASHBOARD/api/kijk?sleutel=$PINGWIN_KIJK_SLEUTEL" > /dev/null || true
          ANTWOORD="$(curl -s --max-time 20 -b "$JAR" "$DASHBOARD/api/admin/punten/ronde" || echo '{}')"
          WERK="$(printf '%s' "$ANTWOORD" | grep -o '"werk":"[a-z]*"' | head -1 | cut -d'"' -f4)"
          NACHT="$(printf '%s' "$ANTWOORD" | grep -o '"nacht":[a-z]*' | head -1 | cut -d':' -f2)"
          # Buiten het venster alleen doorgaan als Maarten zelf op de knop drukte.
          if [ "$NACHT" != "true" ] && [ "$PUNT_HANDMATIG" != "ja" ]; then WERK=""; fi
          echo "werk=${WERK:-geen}" >> "$GITHUB_OUTPUT"
          echo "Wat er klaarstaat: ${WERK:-niets te doen} (nacht: ${NACHT:-onbekend})"

      - name: De laatste code ophalen
        if: steps.kijk.outputs.werk != 'geen'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node klaarzetten
        if: steps.kijk.outputs.werk != 'geen'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pakketten installeren
        if: steps.kijk.outputs.werk != 'geen'
        run: npm ci

      # ── Bouwen: het middelste model ──
      # Er ligt een goedgekeurd plan; dit is uitvoeren wat er staat, niet
      # opnieuw bedenken wat er moet gebeuren.
      - name: Het punt bouwen
        if: steps.kijk.outputs.werk == 'bouwen'
        uses: anthropics/claude-code-action@v1
        env:
          PINGWIN_KIJK_SLEUTEL: ${{ secrets.PINGWIN_KIJK_SLEUTEL }}
          PUNT_RONDE: gh-${{ github.run_id }}
          PUNT_HANDMATIG: ${{ github.event.inputs.handmatig || 'nee' }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/groot-punt bouwen"
          claude_args: "--model claude-sonnet-5 --allowedTools Bash,Edit,Write,Read,Glob,Grep"

      # ── Een plan schrijven: het zwaarste model ──
      # Hier wordt niets gebouwd. Dit is uitdenken wat er moet gebeuren en waar
      # het misgaat, en dat is precies het werk waarvoor het zwaarste model
      # bedoeld is. Het levert een plan op dat Maarten 's ochtends beoordeelt.
      - name: Een plan schrijven
        if: steps.kijk.outputs.werk == 'plan'
        uses: anthropics/claude-code-action@v1
        env:
          PINGWIN_KIJK_SLEUTEL: ${{ secrets.PINGWIN_KIJK_SLEUTEL }}
          PUNT_RONDE: gh-${{ github.run_id }}
          PUNT_HANDMATIG: ${{ github.event.inputs.handmatig || 'nee' }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/groot-punt plan"
          claude_args: "--model claude-opus-5 --allowedTools Bash,Edit,Write,Read,Glob,Grep"

      # ═══════════════════════════════════════════════════════════
      # HET SLOT GAAT ALTIJD TERUG, OOK ALS DE RONDE MISLUKT
      # ═══════════════════════════════════════════════════════════
      # Zonder deze stap houdt een omgevallen ronde het slot vast tot de
      # vervaltijd, en dan staat de hele nacht stil terwijl het scherm zegt dat
      # er iets loopt. Precies dat is bij de tweak-ronde live misgegaan op
      # 15-08-2026; hier staat het er dus vanaf de eerste dag in.
      #
      # `if: always()` is het hele punt: juist een ronde die halverwege omvalt
      # moet de wachtrij vrijgeven. Het punt gaat dan terug in de rij, op zijn
      # eigen plek, en de volgende ronde pakt hem gewoon weer op.
      - name: De wachtrij hoe dan ook teruggeven
        if: always() && steps.kijk.outputs.werk != 'geen'
        env:
          PINGWIN_KIJK_SLEUTEL: ${{ secrets.PINGWIN_KIJK_SLEUTEL }}
        run: |
          JAR="$(mktemp)"
          curl -s --max-time 15 -c "$JAR" \
            "$DASHBOARD/api/kijk?sleutel=$PINGWIN_KIJK_SLEUTEL" > /dev/null || true
          curl -s --max-time 15 -b "$JAR" -X POST \
            -H "Content-Type: application/json" \
            -d "{\"actie\":\"terug\",\"ronde\":\"$PUNT_RONDE\"}" \
            "$DASHBOARD/api/admin/punten/ronde" || true
          echo ""
